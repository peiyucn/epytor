packages:
  - .
overrides:
  # 单副本：@milkdown/components（Crepe 代码块 NodeView）原本解析到 @codemirror/state@6.7.1，
  # 而 @codemirror/view 与 epytor 自己用 6.6.0 —— Compartment/StateEffect 跨副本不被识别，
  # Crepe 的 languageConf.reconfigure 静默失效（代码块无语法高亮，用户实测反馈）
  "@codemirror/state": ^6.7.1
  # 0.18.2 起修 GHSA-238p-pmpm-9mq7（原型污染绕过 trust 限制）。
  # **上限必须排除 0.18.11**：npm 上 katex@0.18.11 被官方标为
  # "Accidentally published with breaking changes. Use 0.19.0 instead."——
  # 它是个误发布的破坏性版本，装上会静默改变渲染行为。
  # 也不动 0.19：crepe 7.22.3 声明 ^0.19.0，但 mermaid 11.16.1 声明 ^0.16.45；
  # 这套 override 的用意就是让两者共用同一份 0.18（否则 mermaid 生成的 HTML 用
  # 0.16 的 class 名、加载的样式表却是 0.18 的，样式错配——见 1a1f8f7）。
  katex: ">=0.18.2 <0.18.11"
  prosemirror-changeset: ^2.3.1
  prosemirror-commands: ^1.7.1
  prosemirror-dropcursor: ^1.8.3
  prosemirror-gapcursor: ^1.4.1
  prosemirror-history: ^1.5.0
  prosemirror-inputrules: ^1.5.1
  prosemirror-keymap: ^1.2.3
  # 1.25.12 起在 NodeType/MarkType.create 里做属性校验——prosemirror-view 1.42.3
  # 的 GHSA-c8x8-7fp4-3x9w 修复把 slice context 属性校验交给 model，model 低于
  # 1.25.12 时该修复等于空转
  prosemirror-model: ^1.25.12
  prosemirror-schema-list: ^1.5.1
  prosemirror-state: ^1.4.4
  prosemirror-tables: ^1.8.5
  prosemirror-transform: ^1.12.0
  # 1.42.3 起修 GHSA-c8x8-7fp4-3x9w（粘贴处理 XSS）
  prosemirror-view: ^1.42.6
  # 安全（Dependabot 警报，2026-09-13）：两个传递依赖钉到补丁版。都不进产物
  # （dist/webview.js / dist/extension.js 里 0 处），升级只为默认分支警报清零。
  # 3.1.8 起修 GHSA-hrr3-gc8f-f4qj（百分号编码八位组导致主机名大小写归一不一致）
  fast-uri: ^3.1.9
  # nanoid 只钉 3.x 线：Milkdown（@milkdown/utils）自己用的是 6.x，不能一起钉
  "nanoid@3": ^3.3.18
  # 2026-09-13 新公布的 advisory（GHSA-2883-xcg3-v3hh）：仅 dev 链（vsce → secretlint）
  js-yaml: ^4.3.2
  # 安全（Dependabot 警报，2026-10-20）：以下均不进产物，升级只为默认分支警报清零。
  # 3.4.16 修 GHSA-6688-9rhm-gjv2 / GHSA-p98j-92pf-mc4p（IN_PLACE 净化后残留可执行标记）
  dompurify: ^3.4.17
  # 1.2.2 修 GHSA-68fv-2mgg-jv7q（source-map 索引节偏移导致事件循环 DoS）
  source-map-js: ^1.2.2
  # 5.0.12 修 GHSA-q2hr-2g5m-vwhr（`{a},b}` 重写的二次方复杂度）
  brace-expansion: ^5.0.12
  # 14.3.1 修 GHSA-253c-mchw-3w2r（linkify 两条二次方路径）；14.x 线内升级
  markdown-it: ^14.3.3
  # 7.29.1 / 8.12.3 分别修 7.x 与 8.x 线全部 13 条 undici 警报。两条线分别钉（不能合并成
  # 一条 ^8：vsce → cheerio 声明的是 ^7.19.0，跨大版本强升级不在本次补丁范围内）
  "undici@7": ^7.29.1
  "undici@8": ^8.12.3
  # 6.16.0 修 GHSA-4mjr-xmp4-gh2g 与 GHSA-x5fp-wj9c-mxmx（isBuffer DoS / 括号键逗号解析）
  qs: ^6.16.1
