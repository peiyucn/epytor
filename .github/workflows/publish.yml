name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: marketplace-publish
    permissions:
      contents: write
      security-events: read
      vulnerability-alerts: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag 提交不在 main 上：先把改动合入 main 再打 tag（E16）"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security gate (fail-closed)
        timeout-minutes: 5
        run: node scripts/security-gate.mjs
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN_ALERTS: ${{ github.token }}
          SECRET_SCAN_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}

      - name: Package extension
        run: mkdir -p releases && pnpm run package

      - name: Publish to VS Code Marketplace
        run: pnpm vsce publish --no-dependencies --packagePath releases/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          extract() {
            awk -v ver="${VERSION}" '
              BEGIN { found=0; lines="" }
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && index($0, "## [") == 1 { exit }
              found { lines = lines $0 "\n" }
              END { printf "%s", lines }
            ' "$1"
          }
          extract CHANGELOG.md > /tmp/release-body-en.md
          extract CHANGELOG.zh-CN.md > /tmp/release-body-zh.md
          {
            if [[ -s /tmp/release-body-en.md ]]; then printf '### English\n\n'; cat /tmp/release-body-en.md; fi
            if [[ -s /tmp/release-body-zh.md ]]; then printf '\n### 中文\n\n'; cat /tmp/release-body-zh.md; fi
          } > /tmp/release-body.md
          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          files: releases/*.vsix
