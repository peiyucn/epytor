name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # 发布环境：Deployments 页留下每次发布记录（dsh-launcher-panel / dsh-sparrow 同款做法）
    environment: marketplace-publish
    permissions:
      contents: write
      # E18 gate reads Dependabot (`vulnerability-alerts`) and code scanning
      # (`security-events`) with GITHUB_TOKEN. Secret scanning is not readable through
      # GITHUB_TOKEN, so that one query uses the SECURITY_ALERTS_TOKEN PAT.
      security-events: read
      vulnerability-alerts: read

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # E18 fail-closed gate: any open Dependabot / code scanning / secret scanning alert, or a
      # check that cannot be completed, aborts the release. Dependabot and code scanning use
      # GITHUB_TOKEN; secret scanning needs the read-only SECURITY_ALERTS_TOKEN fine-grained PAT
      # because GITHUB_TOKEN cannot read those alerts (same wiring as dsh-launcher-panel).
      - name: Security gate (fail-closed)
        timeout-minutes: 5
        run: node scripts/security-gate.mjs
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN_ALERTS: ${{ github.token }}
          SECRET_SCAN_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}

      - name: Package extension
        run: mkdir -p releases && pnpm run package

      - name: Publish to VS Code Marketplace
        run: pnpm vsce publish --no-dependencies --packagePath releases/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # 从两份 CHANGELOG 抽取本版本条目，英文在上、中文在下拼成发布说明。
          # 用 index() 前缀匹配而非正则：awk 里 \[ 是非法转义会退化成字符类，匹配失效。
          extract() {
            awk -v ver="${VERSION}" '
              BEGIN { found=0; lines="" }
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && index($0, "## [") == 1 { exit }
              found { lines = lines $0 "\n" }
              END { printf "%s", lines }
            ' "$1"
          }
          extract CHANGELOG.md > /tmp/release-body-en.md
          extract CHANGELOG.zh-CN.md > /tmp/release-body-zh.md
          {
            if [[ -s /tmp/release-body-en.md ]]; then printf '### English\n\n'; cat /tmp/release-body-en.md; fi
            if [[ -s /tmp/release-body-zh.md ]]; then printf '\n### 中文\n\n'; cat /tmp/release-body-zh.md; fi
          } > /tmp/release-body.md
          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-body.md
          files: releases/*.vsix
