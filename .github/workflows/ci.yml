name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (production)
        run: pnpm run vscode:prepublish
      - name: Verify output files
        run: |
          test -f dist/extension.js || (echo "dist/extension.js missing" && exit 1)
          test -f dist/webview.js   || (echo "dist/webview.js missing" && exit 1)

  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package extension (vsce)
        run: mkdir -p releases && pnpm run package
      - name: Verify VSIX artifact exists
        run: test -f releases/*.vsix || (echo "VSIX not produced" && exit 1)

  publish:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "publish 实质由 publish.yml 在 tag 触发时执行，此处空跑占位"

  deploy:
    name: deploy
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "deploy 空跑（本仓库无部署目标）"

  sync:
    name: sync
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "sync 空跑（本仓库无数据同步）"
